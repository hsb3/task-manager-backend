# Pre-commit checks, launched by .githooks/pre-commit: prettier on the staged TypeScript, then
# `make check-static`, the server-free half of `make check` (it reads the working tree, not the index).
min_version: 2.1.12

pre-commit:
  piped: true
  jobs:
    - name: format
      run: |
        # A git pathspec `*` crosses `/`, so these reach nested files; deletions stage nothing to format.
        files=$(git diff --cached --name-only --diff-filter=ACMR -- 'scripts/*.ts' 'tests/*.ts' 'pb_hooks/*.js')
        [ -z "$files" ] || bunx prettier --check $files || {
          echo "✗ commit blocked — run: bun run format, then re-stage"
          exit 1
        }

    - name: check-static
      run: make check-static
