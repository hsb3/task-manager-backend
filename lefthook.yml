# Pre-commit checks, launched by .githooks/pre-commit; each job runs only when the staged paths can break what it checks.
# Triggers are `skip: run:` Git path selections, never glob/files filters: those drop a staged deletion.
# Checkers read the disk, so each one runs through scripts/with_staged_tree.sh: it judges the INDEX, not a
# working copy dirtied after `git add`. Unwrapped invocations are the ones that already read the index
# (`--staged`), the ones that only derive trigger paths, the prettier block that materialises staged blobs
# itself, and tests/test_verification_environment.ts, whose subject is the real checkout's tooling.
min_version: 2.1.12

pre-commit:
  piped: true
  jobs:
    - name: agent-layout
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(\.agents/|\.claude/|\.codex/|AGENTS\.md$|tests/test_agent_layout\.ts$)'
      run: sh scripts/with_staged_tree.sh bun tests/test_agent_layout.ts

    - name: verification-environment
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(Makefile|mise\.toml|package\.json|scripts/verification-env\.sh|tests/test_verification_environment\.ts|\.githooks/pre-commit|lefthook\.yml)$'
      run: bun tests/test_verification_environment.ts

    - name: ci-changes
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(Makefile|scripts/ci_changes\.sh|scripts/ci_proven\.sh|tests/test_ci_changes\.ts|tests/test_ci_proven\.ts|tests/test_make_targets\.ts|mise\.toml|\.github/workflows/)'
      run: |
        sh scripts/with_staged_tree.sh bun tests/test_ci_changes.ts || exit 1
        sh scripts/with_staged_tree.sh bun tests/test_ci_proven.ts || exit 1
        sh scripts/with_staged_tree.sh bun tests/test_make_targets.ts || exit 1

    - name: battery-copy
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(scripts/run_suite_battery\.sh|tests/test_battery_copy\.ts)$'
      run: sh scripts/with_staged_tree.sh bun tests/test_battery_copy.ts

    # Every generator's own output constant feeds .gitattributes, so any scripts/ or web/ codegen
    # edit can leave it stale — and a stale one silently un-protects a generated artifact.
    - name: gitattributes
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(scripts/|web/scripts/|web/openapi-ts\.config\.ts$|\.gitattributes$)'
      run: |
        sh scripts/with_staged_tree.sh bun scripts/gen_gitattributes.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_gitattributes.ts"
          exit 1
        }

    # pb_hooks/field_patterns.json is generated by gen_schema.ts too, so a hand-edit of it alone
    # has to reach that --check as well.
    - name: schema-artifacts
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(schema/|pb_migrations/|pb_hooks/field_patterns\.json)'
      run: |
        echo "· pre-commit: checking app_docs coverage and rule quotes…"
        sh scripts/with_staged_tree.sh bun scripts/check_app_docs.ts || {
          echo "✗ commit blocked — see above: document the new collection, or resync the"
          echo "  quoted rule text in a data-seed migration, then re-commit."
          exit 1
        }

        # Both specs derive from pb_migrations/ alone, so a schema commit is exactly
        # when they can go stale. openapi.json is the new frontend's contract.
        echo "· pre-commit: checking generated artifacts…"
        sh scripts/with_staged_tree.sh bun scripts/gen_openapi.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_openapi.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/gen_schema.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_schema.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/gen_decisions.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_decisions.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/gen_coverage.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_coverage.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/check_rule_auth_guards.ts || {
          echo "✗ commit blocked — a collection rule admits anonymous callers; fix the rule in pb_migrations/, this is not a regen."
          exit 1
        }

    # The model tree derives from pb_migrations/ alone and the target layer is diffed against
    # it — a migration or a target edit is exactly when either can go stale.
    - name: model-tree
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(pb_migrations/|scripts/model/)'
      run: |
        echo "· pre-commit: checking the entity model tree…"
        sh scripts/with_staged_tree.sh bun scripts/model/extract_current.ts --check || {
          echo "✗ commit blocked — run: bun scripts/model/extract_current.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/model/diff_model.ts || {
          echo "✗ commit blocked — target model and migrations disagree, or an in-place claim lost its test."
          exit 1
        }

    # The fold's copies span two hooks, an immutable migration and the audit script — any one
    # of them staged alone can break the set.
    - name: email-fold
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(pb_hooks/|pb_migrations/|scripts/utilities/email_collision_audit\.ts|scripts/check_email_fold\.ts)'
      run: |
        echo "· pre-commit: checking the inlined email fold…"
        sh scripts/with_staged_tree.sh bun scripts/check_email_fold.ts || {
          echo "✗ commit blocked — the inlined email fold copies disagree; fix the copy named above."
          exit 1
        }

    # prettier owns pb_hooks/*.js, and web's format gate never sees a hooks-only commit.
    # KEEP IN SYNC: the "../pb_hooks/**/*.js" glob in web/package.json's format/format:check.
    - name: hook-formatting
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^pb_hooks/.*\.js$'
      run: |
        root="$(pwd -P)"
        # The pinned local binary, never npx: npx would reach the registry when web/ is uninstalled.
        if [ ! -x "$root/web/node_modules/.bin/prettier" ]; then
          echo "✗ commit blocked — web/node_modules/.bin/prettier is missing; run: cd web && npm ci"
          exit 1
        fi
        echo "· pre-commit: checking hook formatting…"
        # prettier reads the DISK, so a working copy reformatted after `git add` would pass this
        # block while the committed blob stays unformatted — check the staged blobs instead.
        staged_hooks=$(git diff --cached --name-only --diff-filter=ACMR | grep -E '^pb_hooks/.*\.js$')
        # A deletion stages no content to format, and prettier errors when given no file operand.
        if [ -n "$staged_hooks" ]; then
          hooks_snapshot=$(mktemp -d) || exit 1
          trap 'rm -rf "$hooks_snapshot"' EXIT HUP INT TERM
          for f in $staged_hooks; do
            mkdir -p "$hooks_snapshot/$(dirname "$f")"
            git show ":$f" > "$hooks_snapshot/$f" || {
              echo "✗ commit blocked — could not read the staged content of $f"
              exit 1
            }
          done
          # The snapshot holds ONLY the staged files, so the same glob selects exactly them; run it
          # from a stand-in web/ so both the pattern and prettier's config search match the real run.
          mkdir -p "$hooks_snapshot/web"
          ( cd "$hooks_snapshot/web" && "$root/web/node_modules/.bin/prettier" --check "../pb_hooks/**/*.js" ) || {
            echo "✗ commit blocked — the STAGED content of a pb_hooks/*.js file is unformatted;"
            echo "  run: cd web && npm run format — then re-stage it, since reformatting the working"
            echo "  copy alone does not change the blob you are about to commit."
            exit 1
          }
        fi

    # The register and its two rendered pages derive from docs/readouts/features.yml and their own
    # generators — a schema trigger never sees that edit, which is how a stale page merged.
    - name: feature-register
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(docs/|schema/|pb_migrations/|scripts/gen_status\.ts)'
      run: |
        echo "· pre-commit: checking the feature register and its pages…"
        sh scripts/with_staged_tree.sh bun scripts/gen_feature_register.ts --check || {
          echo "✗ commit blocked — edit docs/readouts/features.yml, then: bun scripts/gen_feature_register.ts"
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/gen_status.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_status.ts"
          exit 1
        }

    # Trigger paths come from the script's own CONSTANTS map (never hand-copied here), so a
    # new mirror site extends this job for free the moment it's added there. The derivation runs
    # inside the job, not in `skip:`, because a failing skip command means "run", not "block".
    - name: mirrored-constants
      run: |
        constants_list="$(mktemp)" || exit 1
        bun scripts/check_constants.ts --print-sites > "$constants_list"
        constants_sites_status=$?
        constants_sites="$(cat "$constants_list")"
        if [ "$constants_sites_status" -ne 0 ] || [ -z "$constants_sites" ]; then
          echo "✗ commit blocked — 'bun scripts/check_constants.ts --print-sites' failed"
          echo "  (exit $constants_sites_status) or returned nothing; fix the script before committing."
          rm -f "$constants_list"
          exit 1
        fi
        # Fixed-string whole-line match, never a built regex: real mirror sites live under paths like
        # web/app/(app)/w/[workspace]/ whose ( ) [ ] are regex metacharacters, and an unescaped one
        # silently matches nothing, which would skip this job instead of failing it.
        printf '%s\n' "$constants_sites" > "$constants_list"
        if git diff --cached --name-only | grep -qxF -f "$constants_list"; then
          echo "· pre-commit: checking mirrored constant lists…"
          sh scripts/with_staged_tree.sh bun scripts/check_constants.ts || {
            echo "✗ commit blocked — a mirrored constant list drifted; fix the copy named above, or"
            echo "  run: bun scripts/check_constants.ts for the full report."
            rm -f "$constants_list"
            exit 1
          }
        fi
        rm -f "$constants_list"

    # Trigger paths come from the checker's own SCAN_GLOBS (never hand-copied here), so a newly
    # scanned path family extends this job for free. A broken or empty derivation blocks the
    # commit instead of leaving this check silently inert.
    - name: no-silent-skips
      run: |
        nss_list="$(mktemp)" || exit 1
        bun scripts/check_no_silent_skips.ts --print-globs > "$nss_list"
        nss_globs_status=$?
        nss_globs="$(cat "$nss_list")"
        rm -f "$nss_list"
        if [ "$nss_globs_status" -ne 0 ] || [ -z "$nss_globs" ]; then
          echo "✗ commit blocked — 'bun scripts/check_no_silent_skips.ts --print-globs' failed"
          echo "  (exit $nss_globs_status) or returned nothing; fix the script before committing."
          exit 1
        fi
        # git's :(glob) magic is the only matcher here that reads `**` as ZERO or more directories, the
        # way the checker's Bun.Glob does; case, fnmatch and a bare pathspec all demand a literal / and would miss
        # tests/test_x.ts. set -f stops the shell expanding the * in each pathspec against the worktree.
        set -f
        set --
        for nss_glob in $nss_globs; do set -- "$@" ":(glob)$nss_glob"; done
        set +f
        if [ -n "$(git diff --cached --name-only -- "$@")" ]; then
          echo "· pre-commit: checking the gates declare what they step over…"
          sh scripts/with_staged_tree.sh bun scripts/check_no_silent_skips.ts || {
            echo "✗ commit blocked — a gate-run test or script steps over work undeclared; make it a"
            echo "  hard failure, or add the inline marker named above saying what goes unproven."
            exit 1
          }
        fi

    # A raw `migrate up` argv can only be introduced by a TypeScript file staged under these two trees.
    - name: raw-migrate-up
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(scripts/|tests/).*\.ts$'
      run: |
        echo "· pre-commit: checking the migrate-up spawn stays in one place…"
        sh scripts/with_staged_tree.sh bun scripts/check_raw_migrate_up.ts || {
          echo "✗ commit blocked — import migrate_up from scripts/pb_migrate.ts; it refuses a FAILED migration in either form PB reports."
          exit 1
        }

    # Any docs/ file, plus schema/ and .agents/memory/: the checker's provenance half rules on
    # .html and .json, its byte-identity half enumerates claims out of docs/readouts/features.yml
    # and verifies them against schema/*.rules.json, so an .md-only trigger left both halves
    # unreachable from here; the memory root is a second family with its own key-set rule.
    - name: doc-frontmatter
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(docs/|deploy/|schema/|\.agents/memory/)'
      run: |
        echo "· pre-commit: checking doc frontmatter…"
        sh scripts/with_staged_tree.sh bun scripts/check_doc_frontmatter.ts || {
          echo "✗ commit blocked — fix the frontmatter block at the top of the file(s) named above."
          exit 1
        }

    # Mirrors .claude/hooks/protect_historical_migrations/hook.sh for non-Claude edits (a human,
    # another agent, or plain sed bypasses that PreToolUse hook entirely).
    # KEEP IN SYNC: comment-only predicate lives once in scripts/check_historical_migrations.ts, reached here with `--staged`.
    # Its BASELINE_REBUILD_SUSPENSION is None (armed) since decision-069's rebuild landed; a
    # non-None value suspends this job, then refuses every pb_migrations commit once the marker leaves the ref.
    - name: historical-migrations
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^pb_migrations/'
      run: |
        echo "· pre-commit: checking historical migration immutability…"
        bun scripts/check_historical_migrations.ts --staged || {
          echo "✗ commit blocked — the guard's message above is the whole story: only it knows"
          echo "  which state (armed, suspended, expired) refused this commit."
          exit 1
        }

    # app_docs prose lives only in pb_migrations/ — a re-seed is exactly when a paragraph can vanish;
    # the gate's own allowlist is the other way its verdict can change.
    - name: app-docs-history
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(pb_migrations/|scripts/check_app_docs_history\.ts)'
      run: |
        echo "· pre-commit: checking app_docs prose history…"
        sh scripts/with_staged_tree.sh bun scripts/check_app_docs_history.ts || {
          echo "✗ commit blocked — a re-seed dropped app_docs prose; re-seed the span in a NEW"
          echo "  migration, or allowlist it in scripts/check_app_docs_history.ts with its card."
          exit 1
        }

    # The rescope gate reads rule text AND the tests its allowlist cites, so a test-only commit
    # can strand a citation.
    - name: rescope-guards
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(schema/|pb_migrations/|tests/|scripts/check_rescope_guards\.ts)'
      run: |
        echo "· pre-commit: checking tenant-anchor rescope guards…"
        sh scripts/with_staged_tree.sh bun scripts/check_rescope_guards.ts || {
          echo "✗ commit blocked — an updateRule leaves a tenant anchor repointable; pin it in"
          echo "  pb_migrations/, or allowlist it with the ruling that permits the repoint."
          exit 1
        }

    # Membership grants live in both rule text and pb_hooks filter strings.
    - name: membership-status-guards
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(schema/|pb_hooks/|pb_migrations/|scripts/check_membership_status_guards\.ts)'
      run: |
        echo "· pre-commit: checking membership status guards…"
        sh scripts/with_staged_tree.sh bun scripts/check_membership_status_guards.ts || {
          echo "✗ commit blocked — a membership grant omits status \"active\"; add the pin to the"
          echo "  same disjunct or the same filter string."
          exit 1
        }

    # A viewRule missing a clause its listRule carries leaves a record un-listable but still
    # fetchable by id — only a schema/migration change can introduce or fix that gap.
    - name: view-within-list
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(schema/|pb_migrations/|scripts/check_view_within_list\.ts)'
      run: |
        echo "· pre-commit: checking viewRule ⊆ listRule…"
        sh scripts/with_staged_tree.sh bun scripts/check_view_within_list.ts || {
          echo "✗ commit blocked — a viewRule admits a row its listRule excludes; copy the missing"
          echo "  clause into viewRule in a NEW pb_migrations/ migration and regenerate schema/ with"
          echo "  'bun scripts/gen_schema.ts' (never hand-edit schema/), or add the ALLOWLIST"
          echo "  entry in scripts/check_view_within_list.ts with the ruling that permits it."
          exit 1
        }

    # A fixture that resolves a project positionally as superuser (eew9 / PR #657) can only be
    # introduced or fixed under tests/ or web/e2e/.
    - name: fixture-project-resolve
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(tests/|web/e2e/|scripts/check_fixture_project_resolve\.ts)'
      run: |
        echo "· pre-commit: checking fixture project resolution…"
        sh scripts/with_staged_tree.sh bun scripts/check_fixture_project_resolve.ts || {
          echo "✗ commit blocked — a fixture resolves a project positionally as superuser with no"
          echo "  shadow guard, or names itself the shadow project's reserved display name; see the"
          echo "  finding(s) above."
          exit 1
        }

    # The proxy's ErrorCode union and the contract's enum must name the same set — the pattern
    # must match the checker's own sweep (web/lib/proxy/**/*.ts + web/app/**/route.ts) or a
    # route.ts-only change skips this gate.
    - name: proxy-error-codes
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(web/lib/proxy/|web/app/.*/route\.ts|web/openapi\.contract\.json|scripts/check_proxy_error_codes\.ts)'
      run: |
        echo "· pre-commit: checking proxy ErrorCode coverage…"
        sh scripts/with_staged_tree.sh bun scripts/check_proxy_error_codes.ts || {
          echo "✗ commit blocked — web/lib/proxy/errors.ts's ErrorCode union and the contract's enum"
          echo "  disagree, or a handler throws a code the enum doesn't declare."
          exit 1
        }

    # Neither gate declares its own scan surface, so this predicate is hand-written from their
    # docstrings: both read tests/ and scripts/ alone, plus run_suite_battery.sh.
    - name: clean-room-boots
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(tests/|scripts/)'
      run: |
        echo "· pre-commit: checking clean-room boots…"
        sh scripts/with_staged_tree.sh bun scripts/check_room_preflight.ts || {
          echo "✗ commit blocked — a self-booting suite binds a port without preflighting it, or"
          echo "  leaves a long-lived child's pipe undrained; send its output to a file."
          exit 1
        }
        sh scripts/with_staged_tree.sh bun scripts/check_superuser_before_serve.ts || {
          echo "✗ commit blocked — a suite serves before upserting its superuser; PocketBase's"
          echo "  first-run installer then steals the machine's browser. Upsert first."
          exit 1
        }
        echo "· pre-commit: checking every suite and gate script has a home…"
        sh scripts/with_staged_tree.sh bun scripts/check_battery_suites.ts || {
          echo "✗ commit blocked — a suite or gate script is run by no gate, or a carve-out names a"
          echo "  home that no longer invokes it; wire it in, or declare it with a reason."
          exit 1
        }

    # The four artifacts check_local_mode_isolation reconciles; it declares no scan surface either.
    - name: local-mode-isolation
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(Dockerfile|deploy/local/|pb_hooks/)'
      run: |
        echo "· pre-commit: checking local-mode isolation…"
        sh scripts/with_staged_tree.sh bun scripts/check_local_mode_isolation.ts || {
          echo "✗ commit blocked — the MFA-off local-mode hook is reachable from the prod image, or"
          echo "  a pb_hooks/ file turns superuser MFA on or off; see the finding above."
          exit 1
        }

    # Trigger paths come from the checker's own --print-sites (never hand-copied here): every file
    # that carries a marker or is named by one. A staged deletion or rename is the one drift that
    # list cannot show, because the referent is already off disk — hence the second arm.
    - name: keep-in-sync
      run: |
        kis_list="$(mktemp)" || exit 1
        bun scripts/check_keep_in_sync.ts --print-sites > "$kis_list"
        kis_sites_status=$?
        kis_sites="$(cat "$kis_list")"
        if [ "$kis_sites_status" -ne 0 ] || [ -z "$kis_sites" ]; then
          echo "✗ commit blocked — 'bun scripts/check_keep_in_sync.ts --print-sites' failed"
          echo "  (exit $kis_sites_status) or returned nothing; fix the script before committing."
          rm -f "$kis_list"
          exit 1
        fi
        printf '%s\n' "$kis_sites" > "$kis_list"
        if git diff --cached --name-only | grep -qxF -f "$kis_list" ||
          [ -n "$(git diff --cached --name-only --diff-filter=DR)" ]; then
          echo "· pre-commit: checking KEEP IN SYNC referents…"
          sh scripts/with_staged_tree.sh bun scripts/check_keep_in_sync.ts || {
            echo "✗ commit blocked — a KEEP IN SYNC marker names a file or a literal that no longer"
            echo "  resolves; move the other side of the pair, or correct the marker."
            rm -f "$kis_list"
            exit 1
          }
        fi
        rm -f "$kis_list"

    # Focus rings and accessible names live in the .tsx the checker sweeps — the pattern must match
    # its own sweep (web/components/ + web/app/, any .tsx) or a component-only change skips this gate.
    - name: focus-visible
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(web/(components|app)/.*\.tsx|scripts/check_focus_visible\.ts)'
      run: |
        echo "· pre-commit: checking focus indicators and accessible names…"
        sh scripts/with_staged_tree.sh bun scripts/check_focus_visible.ts || {
          echo "✗ commit blocked — an interactive element turns the browser's focus outline off without"
          echo "  painting one back, or an icon-only control carries no accessible name. Add a"
          echo "  focus-visible: ring (or drop the outline-none), or add aria-label; the rule and its"
          echo "  scope bounds are in web/README.md and the checker's docstring."
          exit 1
        }

    # A decision citation can live in any path, so any staged file fires this; the scan needs no server.
    - name: decision-citations
      skip:
        - run: |
            [ -z "$(git diff --cached --name-only)" ]
      run: |
        echo "· pre-commit: checking cited decisions have register rows…"
        bun scripts/check_decision_citations.ts --staged || {
          echo "✗ commit blocked — a cited decision-NNN has no row in docs/generated/decisions.md;"
          echo "  seed its app_docs record, then: bun scripts/gen_decisions.ts"
          exit 1
        }

    # A PB_VERSION pin site can live in any tracked path, so any staged file fires this; the scan
    # is repo-wide pure file reads and needs no server (measured ~0.07s on this tree).
    - name: pb-pin
      skip:
        - run: |
            [ -z "$(git diff --cached --name-only)" ]
      run: |
        echo "· pre-commit: checking the PocketBase version pin…"
        sh scripts/with_staged_tree.sh bun scripts/check_pb_pin.ts || {
          echo "✗ commit blocked — a PB_VERSION site disagrees with the Dockerfile's ARG PB_VERSION;"
          echo "  see the finding(s) above."
          exit 1
        }

    - name: contract-mirror
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(openapi\.json|web/openapi\.contract\.json)$'
      run: |
        echo "· pre-commit: reconciling the frontend contract against the generated spec…"
        sh scripts/with_staged_tree.sh bun scripts/check_contract_mirror.ts || {
          echo "✗ commit blocked — a mirrored collection has a field the contract neither exposes"
          echo "  nor dispositions; expose it, or record it under x-pb-mirrors.fields with a reason."
          exit 1
        }

    - name: response-producers
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(web/openapi\.contract\.json|web/lib/proxy/|web/app/api/|pb_hooks/|pb_migrations/|tests/test_pb_refusal_statuses\.ts|scripts/check_response_producers\.ts)'
      run: |
        echo "· pre-commit: checking every declared response still has something that raises it…"
        sh scripts/with_staged_tree.sh bun scripts/check_response_producers.ts || {
          echo "✗ commit blocked — the contract declares a response nothing can produce, or names"
          echo "  a serving symbol that no longer exists; see the finding(s) above."
          exit 1
        }

    - name: migration-settings-keys
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^(pb_migrations/|pb_hooks/)'
      run: |
        echo "· pre-commit: checking migrations carry no boot-hook-owned settings block…"
        sh scripts/with_staged_tree.sh bun scripts/check_migration_settings_keys.ts || {
          echo "✗ commit blocked — strip the settings block from the migration; the boot hook owns"
          echo "  it, and on a fresh database the migration would overwrite what the hook wrote."
          exit 1
        }

    - name: app-docs-seed-drift
      skip:
        - run: |
            ! git diff --cached --name-only | grep -qE '^pb_migrations/'
      run: |
        echo "· pre-commit: checking the app_docs seed migration matches a replay…"
        sh scripts/with_staged_tree.sh bun scripts/gen_app_docs_seed.ts --check || {
          echo "✗ commit blocked — run: bun scripts/gen_app_docs_seed.ts"
          exit 1
        }

    # A migration citation can live in any tracked path, so any staged file fires this; the scan
    # is `git ls-files` plus pure file reads and one `git ls-tree` (measured ~0.2s on this tree).
    - name: migration-citations
      skip:
        - run: |
            [ -z "$(git diff --cached --name-only)" ]
      run: |
        echo "· pre-commit: checking cited migration filenames name their set and resolve…"
        sh scripts/with_staged_tree.sh bun scripts/check_migration_citations.ts || {
          echo "✗ commit blocked — a migration filename is cited bare or does not resolve; write"
          echo "  v1:FILE or v2:FILE, or cite the decision record or the collection and field."
          exit 1
        }

    # Trigger paths come from the checker's own SCAN_GLOBS (never hand-copied here), so a newly
    # scanned path family — web/e2e/ was one — extends this job for free; .agents/rules/ports.md is
    # added because the doc half of the check reads it and the scan never does.
    - name: port-collisions
      run: |
        ports_list="$(mktemp)" || exit 1
        bun scripts/check_port_collisions.ts --print-globs > "$ports_list"
        ports_globs_status=$?
        ports_globs="$(cat "$ports_list")"
        rm -f "$ports_list"
        if [ "$ports_globs_status" -ne 0 ] || [ -z "$ports_globs" ]; then
          echo "✗ commit blocked — 'bun scripts/check_port_collisions.ts --print-globs' failed"
          echo "  (exit $ports_globs_status) or returned nothing; fix the script before committing."
          exit 1
        fi
        # :(glob) is the only matcher here that reads `**` as ZERO or more directories, the way
        # the checker's Bun.Glob does; set -f stops the shell expanding each pattern against the worktree.
        set -f
        set -- ":(glob).agents/rules/ports.md"
        for ports_glob in $ports_globs; do set -- "$@" ":(glob)$ports_glob"; done
        set +f
        if [ -n "$(git diff --cached --name-only -- "$@")" ]; then
          echo "· pre-commit: checking suite default ports don't collide…"
          sh scripts/with_staged_tree.sh bun scripts/check_port_collisions.ts || {
            echo "✗ commit blocked — two suites declare the same default port, a docstring names a"
            echo "  port its own file never binds, or .agents/rules/ports.md names a port its suite"
            echo "  doesn't declare; see above."
            exit 1
          }
        fi
