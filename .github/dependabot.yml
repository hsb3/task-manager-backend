# Owner ruling 2026-08-08: version-update PRs for MAJOR bumps only (minor/patch ignored);
# security-alert severity filtering (critical/high) is a UI-only auto-triage rule.
# target-branch is load-bearing: a block carrying it governs VERSION updates only, so the
# ignore rules below cannot suppress security-update PRs (which use defaults, no ignores).
version: 2
updates:
  # The root bun.lock (prettier, typescript, @types/bun, railway); Dependabot reads Bun lockfiles
  # through its bun ecosystem.
  - package-ecosystem: bun
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      # TS 7.0 ships no JS API, which several scripts/ gates parse TypeScript with.
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
