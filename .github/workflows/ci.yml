name: CI

# The repo's one gate is `make check`: its static part runs here as `static`, its battery as the
# four `battery` shards, and `battery-verify` proves the shards together ran every suite once.
on:
  # One run per commit, never two: branch commits are covered by the PR run, `main` by the push run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on main: a direct commit's verdict is per-sha, and cancelling loses it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Must equal the Dockerfile's ARG PB_VERSION, the canonical pin (scripts/check_pb_pin.ts).
  PB_VERSION: "0.40.4"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache PocketBase binary
        uses: actions/cache@v6
        with:
          path: pocketbase
          key: pocketbase-${{ env.PB_VERSION }}-linux-amd64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the static checks
        run: make check-static

  battery:
    runs-on: ubuntu-latest
    strategy:
      # Each shard is its own verdict — battery-verify, not fail-fast, is what joins them.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Dummy CI superuser creds — NOT secrets. The battery upserts these into each clean room.
      PB_SUPERUSER_EMAIL: ci@example.test
      PB_SUPERUSER_PASSWORD: ci-battery-dummy-pw-000
    steps:
      - uses: actions/checkout@v7

      - name: Cache PocketBase binary
        uses: actions/cache@v6
        with:
          path: pocketbase
          key: pocketbase-${{ env.PB_VERSION }}-linux-amd64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the battery shard
        run: make battery
        env:
          BATTERY_SHARD: ${{ matrix.shard }}/4
          BATTERY_MANIFEST: ${{ runner.temp }}/battery-manifest-${{ matrix.shard }}.txt

      - name: Upload the shard's manifest of passed suites
        # always(): a red shard's partial manifest still tells battery-verify what did run.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: battery-manifest-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/battery-manifest-${{ matrix.shard }}.txt
          retention-days: 7
          if-no-files-found: ignore
          # A re-run shard replaces its attempt's manifest; without this the upload 409s.
          overwrite: true

  battery-verify:
    # !cancelled() keeps this join reachable after a red shard.
    needs: battery
    if: "!cancelled()"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the shard manifests
        uses: actions/download-artifact@v8
        with:
          pattern: battery-manifest-shard-*
          merge-multiple: true
          path: battery-manifests

      # First, so a red shard's own failure leads the log instead of its truncated manifest's gaps.
      - name: Require every battery shard to have passed
        env:
          BATTERY_RESULT: ${{ needs.battery.result }}
        run: |
          [ "$BATTERY_RESULT" = success ] || { echo "battery result: $BATTERY_RESULT"; exit 1; }

      - name: Check every suite ran in exactly one shard
        if: always()
        run: make ci-battery-verify

  # Not a required check: the production image booted in Docker, probed through the public API (e2e/smoke.ts).
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Run the smoke probes against the production image
        run: make smoke
