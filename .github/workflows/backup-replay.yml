name: Backup replay

# Replays the current migrations over the newest production backup (decision:refused-migration-fails-the-deploy).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

env:
  # Must equal the Dockerfile's ARG PB_VERSION, the canonical pin (scripts/check_pb_pin.ts).
  PB_VERSION: "0.40.4"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Cache PocketBase binary
        uses: actions/cache@v6
        with:
          path: pocketbase
          key: pocketbase-${{ env.PB_VERSION }}-linux-amd64

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve the PocketBase binary
        run: make pocketbase

      # The secrets stay on this step: the script strips them before PocketBase starts.
      - name: Replay the newest backup
        env:
          PB_BACKUPS_S3_BUCKET: ${{ secrets.PB_BACKUPS_S3_BUCKET }}
          PB_BACKUPS_S3_ENDPOINT: ${{ secrets.PB_BACKUPS_S3_ENDPOINT }}
          PB_BACKUPS_S3_REGION: ${{ secrets.PB_BACKUPS_S3_REGION }}
          PB_BACKUPS_S3_ACCESS_KEY: ${{ secrets.PB_BACKUPS_S3_ACCESS_KEY }}
          PB_BACKUPS_S3_SECRET: ${{ secrets.PB_BACKUPS_S3_SECRET }}
        run: bash scripts/replay_backup.sh
