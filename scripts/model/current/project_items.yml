  = 'active' AND mem3.role = 'admin'), '') || ',') AS TEXT) AS active_admins, CAST(CASE WHEN u.trashed
  != '' THEN 0 ELSE CASE u.type WHEN 'task' THEN (SELECT COUNT(*) FROM comments c WHERE c.task = u.id)
  WHEN 'document' THEN (SELECT COUNT(*) FROM comments c WHERE c.document = u.id) WHEN 'decision' THEN
  (SELECT COUNT(*) FROM comments c WHERE c.decision = u.id) ELSE 0 END END AS NUMERIC) AS comment_count,
  CAST(u.type = 'task' AND EXISTS (SELECT 1 FROM statuses s WHERE s.id = u.status AND s.workspace = u.workspace
  AND s.category IN ('completed', 'canceled')) AS BOOLEAN) AS status_terminal, CAST(u.type = 'task' AND
  EXISTS (SELECT 1 FROM statuses s WHERE s.id = u.status AND s.workspace = u.workspace AND s.category
  = 'canceled') AS BOOLEAN) AS status_off_pipeline, CAST(u.type = 'task' AND EXISTS (SELECT 1 FROM statuses
  s WHERE s.id = u.status AND s.workspace = u.workspace AND s.category NOT IN ('completed', 'canceled'))
