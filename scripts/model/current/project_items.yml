  AS project, t.workspace AS workspace, t.created AS created, t.updated AS updated, t.trashed AS trashed,
  0 AS draft, t.author AS author, t.assignee AS assignee, COALESCE(t.ordinal, 0) AS ordinal, t.due AS
  due, (SELECT j.key FROM workspaces w, json_each(CASE WHEN json_valid(w.priorities) THEN w.priorities
