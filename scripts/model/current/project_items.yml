  AS TEXT) AS milestone, CAST(u.labels AS TEXT) AS labels, CAST(u.dependencies AS TEXT) AS dependencies,
  CAST(u.cycle AS TEXT) AS cycle, CAST(CASE WHEN u.project != '' AND COALESCE((SELECT p.trashed FROM projects
  p WHERE p.id = u.project), 'missing') != '' THEN 1 ELSE 0 END AS NUMERIC) AS project_trashed, CAST(CASE
  WHEN (SELECT w.trashed FROM workspaces w WHERE w.id = u.workspace) != '' THEN 1 ELSE 0 END AS NUMERIC)
  AS workspace_trashed, CAST((SELECT w.owner FROM workspaces w WHERE w.id = u.workspace) AS TEXT) AS workspace_owner,
  CAST((',' || COALESCE((SELECT group_concat(mem2.user) FROM workspace_members mem2 WHERE mem2.workspace
  = u.workspace AND mem2.status = 'active'), '') || ',') AS TEXT) AS active_members, CAST((',' || COALESCE((SELECT
