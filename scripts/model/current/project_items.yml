  0 ELSE 1 END AS NUMERIC) AS has_due, CAST(COALESCE(u.priority_rank, 9999) AS NUMERIC) AS priority_rank,
  CAST(CASE WHEN u.priority_rank IS NULL THEN 0 ELSE 1 END AS NUMERIC) AS has_priority, CAST(u.status
