  t.status AS status, t.priority AS priority, t.parent AS parent, t.milestone AS milestone, t.labels AS
  labels, t.dependencies AS dependencies, t.cycle AS cycle FROM tasks t UNION ALL SELECT d.id, 'decision',
  d.title, d.key, d.project, d.workspace, d.created, d.updated, d.trashed, d.draft, d.author, '', 0, '',
  NULL, d.status, '', '', '', '', '', '' FROM decisions d UNION ALL SELECT o.id, 'document', o.title,
